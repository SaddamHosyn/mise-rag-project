name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (syntax errors only)
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify app module imports
        run: |
          cd app
          python -c "
          import importlib.util, sys
          sys.path.insert(0, '.')
          for module_file in ['config', 'entity_resolver', 'frontend']:
              spec = importlib.util.spec_from_file_location(module_file, f'{module_file}.py')
              importlib.util.module_from_spec(spec)
              print(f'OK  {module_file}.py')
          print('All app modules verified.')
          "

      - name: Verify benchmark script syntax
        run: |
          python -m py_compile scripts/eval_benchmark.py
          echo "OK  scripts/eval_benchmark.py"

      - name: Verify test scripts syntax
        run: |
          python -m py_compile tests/test_gemini.py
          python -m py_compile tests/test_pdf.py
          echo "OK  tests/"
